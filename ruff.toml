# Lint configuration — the rule set is pinned here so local runs and CI agree
# (ruff's defaults can change between releases).

line-length = 100
target-version = "py310"

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes — unused imports/variables, undefined names
  "I",   # import sorting
  "B",   # bugbear — common traps
  "UP",  # outdated Python idioms
]
ignore = [
  # The clipboard/Win32 layer swallows some errors on purpose: a notification
  # that cannot be shown or a shadow copy that cannot be written must not stop
  # the application.
  "B904",
]

[lint.per-file-ignores]
"easycopytracker.py" = ["E402"]  # ctypes declarations come in blocks, imports in between
