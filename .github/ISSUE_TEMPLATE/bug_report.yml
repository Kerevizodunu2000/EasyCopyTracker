name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Never paste `archive.json`, `settings.json` or `copytracker.log` here** —
        they contain your clipboard contents. Redact before sharing.
        For security vulnerabilities, see [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set capture filter to …
        2. Copy …
        3. Open http://localhost:8765 …
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.1 (python --version)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      description: From copytracker.log — remove any clipboard content first.
      render: text
